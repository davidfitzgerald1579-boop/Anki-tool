name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system libraries for headless Qt
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - name: Install dependencies
        run: pip install PyQt6 anki pytest
      - name: Run tests
        run: python -m pytest tests/ -v
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Build .ankiaddon package
        run: python tools/build_ankiaddon.py
      - uses: actions/upload-artifact@v4
        with:
          name: snip_occlusion.ankiaddon
          path: dist/snip_occlusion.ankiaddon
